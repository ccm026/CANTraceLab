[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cantracelab"
version = "0.1.0"
description = "Offline CAN bus trace analysis and diagnostics studio"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-can>=4.6,<5",
    "cantools>=43,<45",
    "PySide6>=6.9,<7",
    "pyqtgraph>=0.13,<1",
    "numpy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
